[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentvoice"
version = "1.0.0"
description = "AI voice sales agent: outbound/inbound phone calls via Twilio + OpenAI Realtime"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "websockets>=13",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
agentvoice = "agentvoice.__main__:main"

[tool.setuptools.packages.find]
include = ["agentvoice*"]

[tool.setuptools.package-data]
agentvoice = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
